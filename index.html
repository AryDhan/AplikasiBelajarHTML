<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Platform Pembelajaran Interaktif Pemrograman Web I — Universitas Siber Asia. Belajar HTML dan CSS dari dasar hingga membuat website.">
  <meta name="theme-color" content="#2563eb">
  <title>WebProg I — Platform Pembelajaran Pemrograman Web</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">

  <!-- CSS Design System -->
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/modules.css">
  <link rel="stylesheet" href="css/playground.css">
  <link rel="stylesheet" href="css/quiz.css">
  <link rel="stylesheet" href="css/responsive.css">

  <!-- App Entry Point (ES Module) -->
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <!-- Skip Link (a11y) -->
  <a href="#app-content" class="skip-link">Langsung ke konten utama</a>

  <div class="app">
    <!-- ==================== SIDEBAR ==================== -->
    <aside class="sidebar" id="sidebar" role="navigation" aria-label="Navigasi utama">
      <div class="sidebar__header">
        <img src="assets/logo.svg" alt="WebProg I Logo" class="sidebar__logo" width="160" height="48">
      </div>
      <nav class="sidebar__nav" id="sidebar-nav" aria-label="Menu navigasi">
        <!-- Populated by js/navigation.js -->
      </nav>
      <div class="sidebar__footer" id="sidebar-footer">
        <!-- Populated by js/navigation.js (progress bar) -->
      </div>
    </aside>

    <!-- Sidebar Overlay (mobile) -->
    <div class="sidebar-overlay" id="sidebar-overlay" aria-hidden="true"></div>

    <!-- ==================== MAIN ==================== -->
    <div class="main">
      <!-- Storage Warning Banner -->
      <div class="storage-banner" id="storage-banner" role="alert">
        <span class="storage-banner__icon">⚠️</span>
        <span>Penyimpanan lokal tidak tersedia. Progress belajar tidak akan tersimpan setelah tab ditutup.</span>
        <button class="storage-banner__dismiss" id="storage-banner-dismiss" aria-label="Tutup peringatan">✕</button>
      </div>

      <!-- Header -->
      <header class="header" role="banner">
        <button class="header__menu-btn" id="menu-toggle" aria-label="Buka menu navigasi" aria-expanded="false">
          ☰
        </button>
        <div class="header__breadcrumb" id="breadcrumb" aria-label="Breadcrumb">
          <span class="header__breadcrumb-item header__breadcrumb-item--active">Beranda</span>
        </div>
        <div class="header__actions">
          <button class="header__theme-btn" id="theme-toggle" aria-label="Beralih ke mode gelap" data-tooltip="Toggle tema">
            🌙
          </button>
        </div>
      </header>

      <!-- Content Area -->
      <main class="content" id="app-content" role="main" aria-label="Konten utama">
        <!-- Skeleton loader shown during initial load -->
        <div class="skeleton">
          <div class="skeleton__line skeleton__line--title"></div>
          <div class="skeleton__line skeleton__line--text"></div>
          <div class="skeleton__line skeleton__line--text"></div>
          <div class="skeleton__line skeleton__line--short"></div>
        </div>
      </main>
    </div>
  </div>
</body>
</html>
